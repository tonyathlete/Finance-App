
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoBudget.ca — Analysez votre budget gratuitement</title>
    <meta name="description" content="Découvrez où va votre argent chaque mois. Obtenez une analyse gratuite de votre budget en 3 minutes.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              royal: {
                50:  '#eef4ff',
                100: '#d9e6ff',
                200: '#bcd3ff',
                300: '#8fb6ff',
                400: '#5b8ef8',
                500: '#3570ea',
                600: '#2560d6',
                700: '#1e4ec0',
                800: '#1c3f97',
                900: '#1a3877',
              },
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes scaleUp {
        from { transform: scale(0.95); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      .animate-fadeIn { animation: fadeIn 0.35s ease-out; }
      .animate-scaleUp { animation: scaleUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
      .animate-floatSlow { animation: floatSlow 6s ease-in-out infinite; }

      body { font-family: 'Inter', sans-serif; }
      .font-display { font-family: 'Sora', sans-serif; }

      /* App shell — centered mobile canvas on a royal-blue field */
      .app-bg { background-color: #2560d6; }

      /* Soft elevated white cards / sheets */
      .card-elevated {
        box-shadow: 0 1px 2px rgba(21,58,138,0.05), 0 12px 30px -12px rgba(21,58,138,0.22);
      }
      .card-elevated:hover {
        box-shadow: 0 2px 4px rgba(21,58,138,0.06), 0 18px 40px -14px rgba(21,58,138,0.28);
      }

      /* Floating action button (bottom-nav center) */
      .fab {
        box-shadow: 0 10px 25px -6px rgba(21,58,138,0.45);
      }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(37,96,214,0.35); border-radius: 3px; }
    </style>
<script type="importmap">

  }
}
</script>
</head>
<body class="app-bg font-sans min-h-screen">

</body>
</html>
